name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node -e "console.log(require.resolve('ts-jest'))"
      - run: npm run test:check

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node -e "console.log(require.resolve('ts-jest'))"
      - run: npm run test:coverage -- --ci --coverageReporters=text --coverageReporters=json-summary
      - name: Enforce 90 percent line coverage
        run: |
          LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Line coverage: ${LINES}%"
          if node -e "process.exit(Number(process.argv[1]) < 90 ? 0 : 1)" "$LINES"; then
            echo "::error::Line coverage $LINES% is below 90% threshold"
            exit 1
          fi
          echo "Line coverage $LINES% meets 90% threshold"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm audit --audit-level=high
      - name: Check for known vulnerabilities
        run: |
          AUDIT=$(npm audit --json 2>/dev/null || true)
          HIGH=$(echo $AUDIT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log((d.metadata?.vulnerabilities?.high||0)+(d.metadata?.vulnerabilities?.critical||0))")
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::Found $HIGH high/critical vulnerabilities. Run 'npm audit fix' to resolve."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx tsc -b
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, coverage, security, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/prepea
            git pull --ff-only origin main
            npm ci --include=dev
            npm run build
            sudo systemctl reload nginx
